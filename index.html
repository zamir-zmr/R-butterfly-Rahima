<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahima Butterfly</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #05020a;
            --bg-gradient: radial-gradient(circle at 50% 12%, #1e0b2e 0%, #0a0314 55%, #030108 100%);
            --glass-bg: rgba(18, 8, 28, 0.65);
            --glass-border: rgba(255, 182, 193, 0.18);
            --glass-border-hover: rgba(255, 182, 193, 0.45);
            --primary-pink: #ff6b8b;
            --accent-gold: #ffd700;
            --text-main: #fff5f7;
            --text-muted: #d4b5c9;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-deep);
            background-image: var(--bg-gradient);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
        }

        /* Ambient background bokeh particles */
        .ambient-particle {
            position: absolute;
            background: radial-gradient(circle, rgba(255,220,240,0.85) 0%, rgba(255,160,200,0.12) 70%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            animation: floatUp linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.2); opacity: 0; }
            15% { opacity: 0.55; }
            85% { opacity: 0.55; }
            100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }
        }

        /* Fireflies for enchanted depth */
        .firefly {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 12px #ffafcc, 0 0 24px #ff8fa3, 0 0 36px #ffd700;
            pointer-events: none;
            animation: fireflyFloat 7s ease-in-out infinite alternate;
        }

        @keyframes fireflyFloat {
            0% { transform: translate(0, 0); opacity: 0.1; }
            50% { opacity: 0.95; }
            100% { transform: translate(var(--dx), var(--dy)); opacity: 0.1; }
        }

        /* Executive Cinematic Header */
        .header-card {
            position: absolute;
            top: 0px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 1px 32px;
            border-radius: 50px;
            text-align: center;
            color: var(--text-main);
            font-family: 'Cinzel', serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            box-shadow: 0 16px 48px 0 rgba(0, 0, 0, 0.55);
            pointer-events: none;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideDown 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideDown {
            0% { transform: translate(-50%, -40px); opacity: 0; }
            100% { transform: translate(-50%, 0); opacity: 1; }
        }

        .header-card span {
            color: var(--primary-pink);
            font-size: 16px;
            animation: pulseHeart 1.6s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        /* Professional Control Dock */
        .controls-footer {
            position: absolute;
            bottom: 0px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 10px 18px;
            border-radius: 28px;
            display: flex;
            gap: 12px;
            z-index: 20;
            box-shadow: 0 12px 36px rgba(0,0,0,0.6);
            animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            0% { transform: translate(-50%, 50px); opacity: 0; }
            100% { transform: translate(-50%, 0); opacity: 1; }
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            padding: 9px 18px;
            border-radius: 18px;
            cursor: pointer;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.4px;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn:hover {
            background: rgba(255, 107, 139, 0.2);
            border-color: rgba(255, 107, 139, 0.5);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 139, 0.3);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        /* Botanical Element Styling */
        .flower {
            position: absolute;
            font-size: 28px; 
            transform: translate(-50%, -50%) scale(0);
            z-index: 2;
            cursor: pointer;
            filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.5));
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-25deg); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
        }

        .flower:hover {
            transform: translate(-50%, -50%) scale(1.25);
        }

        .flower:active {
            transform: translate(-50%, -50%) scale(1.4);
        }

        /* Advanced Liquid Nectar Splashes */
        .juice-splash {
            position: absolute;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .liquid-drop {
            position: absolute;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.98), rgba(255, 215, 0, 0.92) 45%, rgba(255, 110, 40, 0.98) 100%);
            border-radius: 50%;
            box-shadow: inset -2px -2px 6px rgba(160, 50, 0, 0.7), 0 4px 10px rgba(255, 180, 0, 0.5);
            animation: realisticSplash 0.9s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
        }

        @keyframes realisticSplash {
            0% { transform: translate(0, 0) scale(0.2); opacity: 1; }
            50% { opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.15); opacity: 0; }
        }

        /* Realistic Butterfly Animation Engine with Dual-Layer Wings */
        .butterfly-container {
            position: absolute;
            width: 56px;
            height: 56px;
            display: flex;
            justify-content: center;
            align-items: center;
            left: 50%;
            top: 50%;
            transition: left 1.8s cubic-bezier(0.35, 0, 0.25, 1), top 1.8s cubic-bezier(0.35, 0, 0.25, 1), transform 0.4s ease-out;
            z-index: 50;
            transform-origin: center center;
            pointer-events: none;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.7));
        }

        .butterfly-body {
            position: absolute;
            font-size: 38px;
            z-index: 3;
            transform: rotate(90deg);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        .wing-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wing {
            position: absolute;
            font-size: 42px; 
            width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
        }

        .wing.left {
            left: 0;
            justify-content: flex-start;
            transform-origin: right center;
            animation: flapLeft 0.1s ease-in-out infinite alternate;
        }

        .wing.right {
            right: 0;
            justify-content: flex-end;
            transform-origin: left center;
            animation: flapRight 0.1s ease-in-out infinite alternate;
        }

        .butterfly-container.drinking .wing.left {
            animation-duration: 0.38s; 
        }
        .butterfly-container.drinking .wing.right {
            animation-duration: 0.38s; 
        }

        @keyframes flapLeft {
            0% { transform: scaleX(1) rotateY(0deg); }
            100% { transform: scaleX(0.15) rotateY(75deg); }
        }

        @keyframes flapRight {
            0% { transform: scaleX(1) rotateY(0deg); }
            100% { transform: scaleX(0.15) rotateY(-75deg); }
        }

        /* Interactive Click Ripple */
        .click-ripple {
            position: absolute;
            border: 2px solid rgba(255, 107, 139, 0.65);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0.2);
            pointer-events: none;
            animation: rippleEffect 0.65s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            z-index: 5;
        }

        @keyframes rippleEffect {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2.8); opacity: 0; }
        }

        /* Interactive Modal Info Overlay */
        .info-modal {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border-hover);
            padding: 12px 24px;
            border-radius: 20px;
            color: #ffd1dc;
            font-size: 13px;
            letter-spacing: 0.5px;
            z-index: 25;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .info-modal.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="header-card">
        <span>❤</span> Dedicated to Rahima Zaina's Mommy <span>❤</span>
    </div>

    <div class="info-modal" id="infoModal">✨WELCOME✨</div>

    <div class="controls-footer">
        <button class="control-btn" id="toggleTheme">✨ Atmosphere</button>
        <button class="control-btn" id="speedUp">⚡ Flight Speed</button>
        <button class="control-btn" id="shuffleFlowers">🌸 Refresh Flora</button>
    </div>

    <div class="butterfly-container" id="butterfly">
        <div class="butterfly-body"></div>
        <div class="wing-layer">
            <div class="wing left">🦋</div>
            <div class="wing right">🦋</div>
        </div>
    </div>

    <script>
        // High-density ambient background particles
        for (let i = 0; i < 40; i++) {
            const particle = document.createElement('div');
            particle.className = 'ambient-particle';
            const size = 3 + Math.random() * 6;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDuration = (10 + Math.random() * 12) + 's';
            particle.style.animationDelay = (Math.random() * 6) + 's';
            document.body.appendChild(particle);
        }

        // Glowing fireflies
        for (let i = 0; i < 18; i++) {
            const firefly = document.createElement('div');
            firefly.className = 'firefly';
            firefly.style.left = Math.random() * 100 + 'vw';
            firefly.style.top = Math.random() * 100 + 'vh';
            firefly.style.setProperty('--dx', (Math.random() * 180 - 90) + 'px');
            firefly.style.setProperty('--dy', (Math.random() * 180 - 90) + 'px');
            firefly.style.animationDuration = (4 + Math.random() * 4) + 's';
            firefly.style.animationDelay = (Math.random() * 3) + 's';
            document.body.appendChild(firefly);
        }

        const butterfly = document.getElementById('butterfly');
        const flowersPool = ['🌻', '🌹', '🌺', '🌼', '🌷', '🌸', '💐', '🪷'];
        
        // Precise double-line matrix coordinates forming the letter 'R'
        const perfectRGrid = [
            // --- LEFT STEM (DOUBLE LINE) ---
            {x: 20, y: 15, delay: 0.0}, {x: 20, y: 22, delay: 0.04}, {x: 20, y: 29, delay: 0.08}, {x: 20, y: 36, delay: 0.12}, {x: 20, y: 43, delay: 0.16}, {x: 20, y: 50, delay: 0.20}, {x: 20, y: 57, delay: 0.24}, {x: 20, y: 64, delay: 0.28}, {x: 20, y: 71, delay: 0.32}, {x: 20, y: 78, delay: 0.36}, {x: 20, y: 85, delay: 0.40},
            {x: 27, y: 15, delay: 0.02}, {x: 27, y: 22, delay: 0.06}, {x: 27, y: 29, delay: 0.10}, {x: 27, y: 36, delay: 0.14}, {x: 27, y: 43, delay: 0.18}, {x: 27, y: 50, delay: 0.22}, {x: 27, y: 57, delay: 0.26}, {x: 27, y: 64, delay: 0.30}, {x: 27, y: 71, delay: 0.34}, {x: 27, y: 78, delay: 0.38}, {x: 27, y: 85, delay: 0.42},

            // --- TOP LOOP / CURVE (DOUBLE LINE) ---
            {x: 35, y: 13, delay: 0.46}, {x: 44, y: 12, delay: 0.50}, {x: 54, y: 12, delay: 0.54}, {x: 64, y: 14, delay: 0.58}, {x: 74, y: 20, delay: 0.62}, {x: 79, y: 28, delay: 0.66}, {x: 77, y: 38, delay: 0.70}, {x: 70, y: 46, delay: 0.74}, {x: 58, y: 50, delay: 0.78}, {x: 45, y: 50, delay: 0.82}, {x: 35, y: 50, delay: 0.86},
            {x: 35, y: 20, delay: 0.48}, {x: 44, y: 19, delay: 0.52}, {x: 54, y: 19, delay: 0.56}, {x: 62, y: 22, delay: 0.60}, {x: 69, y: 28, delay: 0.64}, {x: 71, y: 36, delay: 0.68}, {x: 66, y: 42, delay: 0.72}, {x: 56, y: 45, delay: 0.76}, {x: 45, y: 45, delay: 0.80}, {x: 35, y: 45, delay: 0.84},

            // --- DIAGONAL LEG (DOUBLE LINE) ---
            {x: 38, y: 56, delay: 0.90}, {x: 45, y: 62, delay: 0.94}, {x: 53, y: 68, delay: 0.98}, {x: 61, y: 74, delay: 1.02}, {x: 69, y: 80, delay: 1.06}, {x: 77, y: 86, delay: 1.10},
            {x: 42, y: 54, delay: 0.92}, {x: 49, y: 60, delay: 0.96}, {x: 57, y: 66, delay: 1.00}, {x: 65, y: 72, delay: 1.04}, {x: 73, y: 78, delay: 1.08}, {x: 81, y: 84, delay: 1.12}
        ];

        const flowerPositions = [];
        let currentX = window.innerWidth / 2;
        let currentY = window.innerHeight / 2;
        
        let flightTimeout = null;
        let drinkTimeout = null;
        let flightDuration = 1.5; // Optimized smooth flight duration

        perfectRGrid.forEach((pos) => {
            const flowerEl = document.createElement('div');
            flowerEl.className = 'flower';
            flowerEl.innerText = flowersPool[Math.floor(Math.random() * flowersPool.length)];
            flowerEl.style.animationDelay = pos.delay + 's';
            
            const fx = Math.floor((pos.x / 100) * window.innerWidth);
            const fy = Math.floor((pos.y / 100) * window.innerHeight);
            
            flowerEl.style.left = fx + 'px';
            flowerEl.style.top = fy + 'px';
            document.body.appendChild(flowerEl);
            
            const positionObj = { x: fx, y: fy, element: flowerEl };
            flowerPositions.push(positionObj);

            const handleInteraction = (e) => {
                e.stopPropagation();
                createRipple(fx, fy);
                triggerJuiceAndFly(positionObj);
            };
            flowerEl.addEventListener('click', handleInteraction);
            flowerEl.addEventListener('touchstart', handleInteraction);
        });

        function createRipple(x, y) {
            const ripple = document.createElement('div');
            ripple.className = 'click-ripple';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            ripple.style.width = '70px';
            ripple.style.height = '70px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 650);
        }

        function triggerJuiceAndFly(targetPoint) {
            clearTimeout(flightTimeout);
            clearTimeout(drinkTimeout);

            const currentComputedStyle = window.getComputedStyle(butterfly);
            currentX = parseFloat(currentComputedStyle.left);
            currentY = parseFloat(currentComputedStyle.top);

            // Realistic multi-droplet nectar splash animation
            const splashContainer = document.createElement('div');
            splashContainer.className = 'juice-splash';
            splashContainer.style.left = targetPoint.x + 'px';
            splashContainer.style.top = targetPoint.y + 'px';

            const numDrops = 9;
            for (let i = 0; i < numDrops; i++) {
                const drop = document.createElement('div');
                drop.className = 'liquid-drop';
                
                const angle = (i / numDrops) * 2 * Math.PI + (Math.random() * 0.3);
                const distance = 35 + Math.random() * 45;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance + 20;
                
                drop.style.setProperty('--tx', tx + 'px');
                drop.style.setProperty('--ty', ty + 'px');
                
                const size = 6 + Math.random() * 10;
                drop.style.width = size + 'px';
                drop.style.height = size + 'px';
                
                splashContainer.appendChild(drop);
            }

            document.body.appendChild(splashContainer);
            setTimeout(() => splashContainer.remove(), 900);

            targetPoint.element.style.transform = 'translate(-50%, -50%) scale(1.5)';
            setTimeout(() => {
                targetPoint.element.style.transform = 'translate(-50%, -50%) scale(1)';
            }, 320);

            startFlight(targetPoint);
        }

        function startFlight(targetPoint) {
            butterfly.classList.remove('drinking');

            const nextX = targetPoint.x - 28; 
            const nextY = targetPoint.y - 28;

            const deltaX = nextX - currentX;
            const deltaY = nextY - currentY;

            const angleRadians = Math.atan2(deltaY, deltaX);
            let angleDegrees = angleRadians * (180 / Math.PI) + 90;

            butterfly.style.transition = `left ${flightDuration}s cubic-bezier(0.35, 0, 0.25, 1), top ${flightDuration}s cubic-bezier(0.35, 0, 0.25, 1), transform 0.4s ease-out`;
            butterfly.style.transform = `rotate(${angleDegrees}deg)`;
            butterfly.style.left = nextX + 'px';
            butterfly.style.top = nextY + 'px';

            currentX = nextX;
            currentY = nextY;

            flightTimeout = setTimeout(() => {
                butterfly.classList.add('drinking');
                drinkTimeout = setTimeout(() => {
                    chooseNextSequenceRoute();
                }, 1200); 
            }, flightDuration * 1000); 
        }

        function chooseNextSequenceRoute() {
            if (flowerPositions.length === 0) return;
            const randomFlower = flowerPositions[Math.floor(Math.random() * flowerPositions.length)];
            
            const currentComputedStyle = window.getComputedStyle(butterfly);
            currentX = parseFloat(currentComputedStyle.left);
            currentY = parseFloat(currentComputedStyle.top);

            startFlight(randomFlower);
        }

        // Professional Control Dock Functionality
        let themeIndex = 0;
        const themes = [
            {
                deep: '#05020a',
                gradient: 'radial-gradient(circle at 50% 12%, #1e0b2e 0%, #0a0314 55%, #030108 100%)'
            },
            {
                deep: '#02060e',
                gradient: 'radial-gradient(circle at 50% 12%, #0a2135 0%, #040e18 55%, #010408 100%)'
            },
            {
                deep: '#0a0204',
                gradient: 'radial-gradient(circle at 50% 12%, #2b0c13 0%, #120306 55%, #050102 100%)'
            }
        ];
        
        document.getElementById('toggleTheme').addEventListener('click', () => {
            themeIndex = (themeIndex + 1) % themes.length;
            document.body.style.background = themes[themeIndex].deep;
            document.body.style.backgroundImage = themes[themeIndex].gradient;
        });

        document.getElementById('speedUp').addEventListener('click', () => {
            if (flightDuration === 1.5) {
                flightDuration = 0.8;
                document.getElementById('speedUp').innerText = '⚡ Speed: Fast';
            } else if (flightDuration === 0.8) {
                flightDuration = 2.3;
                document.getElementById('speedUp').innerText = '🐢 Speed: Calm';
            } else {
                flightDuration = 1.5;
                document.getElementById('speedUp').innerText = '⚡ Flight Speed';
            }
        });

        document.getElementById('shuffleFlowers').addEventListener('click', () => {
            flowerPositions.forEach(f => {
                f.element.innerText = flowersPool[Math.floor(Math.random() * flowersPool.length)];
                f.element.style.transform = 'translate(-50%, -50%) scale(1.25)';
                setTimeout(() => {
                    f.element.style.transform = 'translate(-50%, -50%) scale(1)';
                }, 300);
            });
        });

        // Show welcome toast info modal temporarily
        const modal = document.getElementById('infoModal');
        setTimeout(() => modal.classList.add('show'), 800);
        setTimeout(() => modal.classList.remove('show'), 5000);

        // Initialize butterfly automation sequence after intro
        setTimeout(chooseNextSequenceRoute, 1500);
    </script>
</body>
</html>
